<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TG URL 管理</title><style>:root{--bg:#0b1020;--card:#111a2b;--line:#2d3c5b;--text:#edf3ff;--muted:#97a7c2;--blue:#62b7f4;--red:#f36d88}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,"Microsoft YaHei",sans-serif}.wrap{max-width:880px;margin:0 auto;padding:35px 20px}h1{margin:0 0 7px}.sub{color:var(--muted);line-height:1.65}.card{margin-top:18px;padding:18px;border:1px solid var(--line);border-radius:13px;background:var(--card)}input{width:100%;background:#09101d;border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--text);font:inherit}.row{display:grid;grid-template-columns:1fr 2fr auto auto auto;gap:8px;align-items:center;margin:9px 0}.btn{border:0;border-radius:8px;padding:9px 12px;background:#243652;color:#fff;cursor:pointer;font:inherit}.primary{background:var(--blue);color:#07111d;font-weight:800}.danger{background:#792f44}.status{margin-top:12px;color:var(--muted)}.hide{display:none}@media(max-width:700px){.row{grid-template-columns:1fr 1fr}.row .wide{grid-column:span 2}}</style></head><body><main class="wrap"><h1>TG URL 管理</h1><p class="sub">添加、删除、排序或启用 Telegram 入口。保存后会安全写回 GitHub，入口页将读取最新配置。</p><section class="card" id="login"><label>管理员访问密钥</label><input id="key" type="password" placeholder="输入管理密钥"><button class="btn primary" style="margin-top:12px" onclick="login()">进入管理</button><p class="sub">密钥不会保存到 GitHub；关闭页面后会自动失效。</p></section><section class="card hide" id="editor"><div id="links"></div><button class="btn" onclick="add()">+ 新增链接</button><button class="btn primary" onclick="save()">保存并发布配置</button><div id="status" class="status"></div></section></main><script>const API='https://tg-url-gateway.pages.dev/api/links';let token='',links=[];const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function login(){token=key.value.trim();if(!token)return;try{const r=await fetch(API,{headers:{'X-Admin-Key':token}});if(!r.ok)throw Error();links=(await r.json()).links||[];loginEl.classList.add('hide');editor.classList.remove('hide');render()}catch{alert('访问密钥错误或服务暂不可用。')}}const loginEl=document.querySelector('#login'),editor=document.querySelector('#editor');function render(){document.querySelector('#links').innerHTML=links.map((x,i)=>`<div class="row"><input value="${esc(x.label)}" placeholder="名称" oninput="links[${i}].label=this.value"><input class="wide" value="${esc(x.url)}" placeholder="https://t.me/..." oninput="links[${i}].url=this.value"><button class="btn" onclick="links[${i}].active=!links[${i}].active;render()">${x.active?'启用':'停用'}</button><button class="btn" onclick="move(${i},-1)">↑</button><button class="btn danger" onclick="links.splice(${i},1);render()">删除</button></div>`).join('')||'<p class="sub">还没有链接，点击下方新增。</p>'}function add(){links.push({id:'l_'+Date.now().toString(36),label:'新入口',url:'',active:true});render()}function move(i,d){const j=i+d;if(j<0||j>=links.length)return;[links[i],links[j]]=[links[j],links[i]];render()}async function save(){for(const x of links){if(!x.label.trim()||!/^https:\/\/(t\.me|telegram\.me)\//.test(x.url.trim()))return alert('每个链接必须有名称，并且必须是 https://t.me/ 或 telegram.me 地址。');x.url=x.url.trim()}status.textContent='正在保存…';const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','X-Admin-Key':token},body:JSON.stringify({links})}),d=await r.json();status.textContent=r.ok?'已保存到 GitHub；入口页会读取最新链接。':(d.error||'保存失败。')}</script></body></html>
