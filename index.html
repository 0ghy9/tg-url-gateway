<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>正在打开网页</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1020;color:#eef3ff;font:15px Inter,"Microsoft YaHei",sans-serif}.box{width:min(440px,calc(100vw - 40px));padding:34px;border:1px solid #2c3a59;border-radius:18px;background:#111a2b;box-shadow:0 20px 70px #0008;text-align:center}.mark{width:54px;height:54px;display:grid;place-items:center;margin:auto;border-radius:16px;background:#2aabee;font-size:27px}.spin{width:24px;height:24px;border:3px solid #5c6d8d;border-top-color:#8cc9ff;border-radius:50%;margin:22px auto 12px;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}h1{font-size:20px;margin:0 0 8px}p{color:#aebbd1;line-height:1.7}.btn{display:inline-block;margin-top:14px;padding:10px 16px;border:0;border-radius:9px;background:#2aabee;color:#07111d;font-weight:800;text-decoration:none}.small{font-size:12px;color:#7888a3;margin-top:20px}</style></head><body><main class="box"><div class="mark">↗</div><div class="spin"></div><h1 id="title">正在为你打开网页…</h1><p id="hint">正在准备跳转，请稍候。</p><a class="btn" id="go" href="#" style="display:none">立即打开</a><p class="small">若未自动打开，请点击上方按钮。</p></main><script>const API='https://tg-url-gateway.pages.dev/api/links';const qs=new URLSearchParams(location.search);const preferred=qs.get('id');const sleep=ms=>new Promise(r=>setTimeout(r,ms));(async()=>{try{const r=await fetch(API,{cache:'no-store'}),d=await r.json(),all=(d.links||[]).filter(x=>x.active&&/^https?:\/\//i.test(x.url));let link=preferred?all.find(x=>x.id===preferred):null;if(!link)link=all[Math.floor(Math.random()*all.length)];if(!link)throw Error('暂无可用链接');go.href=link.url;hint.textContent=`即将进入 ${link.label||'目标网页'}，你也可以立即点击下方按钮。`;go.style.display='inline-block';await sleep(1100+Math.floor(Math.random()*1700));location.assign(link.url)}catch(e){title.textContent='暂时没有可用入口';hint.textContent='请稍后刷新页面，或联系网站管理员。'}})();</script></body></html>
